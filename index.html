<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Number Names</title>
<meta name="description" content="Type a number and hear its name.">
<meta name="theme-color" content="#1d2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Numbers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #1d2433;
    --panel: #2a3347;
    --screen: #e9f5d8;
    --screen-ink: #1b2a12;
    --hi: #ffd84d;
    --key: #f4f6fb;
    --key-ink: #1d2433;
    --key-shadow: #b7bfd1;
    --clear: #ff8a7a;
    --back: #ffc06b;
    --speak: #4cc38a;
    --speak-shadow: #2c8a5e;
    --stop: #e85d75;
    --stop-shadow: #a63a4e;
    --gap: clamp(8px, 2.2vmin, 14px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    font-family: "Avenir Next", "Nunito", "Segoe UI Rounded", system-ui, -apple-system, sans-serif;
    color: #fff;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }
  .app {
    height: 100dvh;
    max-width: 560px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + var(--gap)) calc(env(safe-area-inset-right) + var(--gap))
             calc(env(safe-area-inset-bottom) + var(--gap)) calc(env(safe-area-inset-left) + var(--gap));
    display: flex; flex-direction: column; gap: var(--gap);
  }

  /* ---------- display ---------- */
  .screen {
    flex: 1 1 34%;
    min-height: 120px;
    background: var(--screen);
    color: var(--screen-ink);
    border-radius: 22px;
    box-shadow: inset 0 4px 0 rgba(0,0,0,.12), 0 0 0 6px var(--panel);
    padding: 14px 16px 10px;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .digits-box { flex: 1 1 auto; position: relative; min-height: 0; }
  .digits {
    position: absolute; inset: 0;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: flex-end;
    font-weight: 800; line-height: 1.08;
    font-variant-numeric: tabular-nums;
    letter-spacing: .01em;
  }
  .grp { white-space: nowrap; border-radius: .18em; padding: 0 .04em; transition: background .15s; }
  .grp.on { background: var(--hi); }
  .comma { opacity: .45; }
  .words {
    flex: 0 0 auto;
    max-height: 3.6em;
    overflow-y: auto;
    font-size: clamp(13px, 3.6vmin, 17px);
    line-height: 1.2;
    color: #3d5230;
    margin-top: 6px;
    text-align: right;
    min-height: 1.2em;
  }
  .words .on { background: var(--hi); color: var(--screen-ink); border-radius: 4px; }

  /* ---------- keys ---------- */
  .pad {
    flex: 0 1 auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--gap);
  }
  button {
    font: inherit; border: 0; cursor: pointer;
    border-radius: 20px;
    font-weight: 800;
    transition: transform .06s, box-shadow .06s;
  }
  .key {
    aspect-ratio: 1.45 / 1;
    background: var(--key); color: var(--key-ink);
    font-size: clamp(30px, 9vmin, 52px);
    box-shadow: 0 6px 0 var(--key-shadow);
  }
  .key:active, .key.pressed { transform: translateY(5px); box-shadow: 0 1px 0 var(--key-shadow); }
  .key.clear { background: var(--clear); box-shadow: 0 6px 0 #c95a4c; font-size: clamp(24px, 7vmin, 40px); }
  .key.clear:active { box-shadow: 0 1px 0 #c95a4c; }
  .key.back { background: var(--back); box-shadow: 0 6px 0 #c98a3a; }
  .key.back:active { box-shadow: 0 1px 0 #c98a3a; }
  .key:disabled { opacity: .4; cursor: default; transform: none; }
  .key svg { width: 1em; height: 1em; vertical-align: middle; }

  .speak {
    flex: 0 0 auto;
    min-height: clamp(72px, 13vh, 110px);
    background: var(--speak); color: #fff;
    font-size: clamp(30px, 8.5vmin, 48px);
    box-shadow: 0 7px 0 var(--speak-shadow);
    display: flex; align-items: center; justify-content: center; gap: .4em;
    letter-spacing: .03em;
    margin-bottom: 7px;
  }
  .speak:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--speak-shadow); }
  .speak svg { width: 1.1em; height: 1.1em; }
  .speak.stop { background: var(--stop); box-shadow: 0 7px 0 var(--stop-shadow); }
  .speak.stop:active { box-shadow: 0 1px 0 var(--stop-shadow); }
  .speak:disabled { opacity: .5; }

  .toast {
    position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
    background: var(--screen-ink); color: var(--screen);
    padding: 4px 12px; border-radius: 999px; font-size: 14px; font-weight: 700;
    opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: .9; }

  /* landscape phones: keypad beside screen */
  @media (orientation: landscape) and (max-height: 500px) {
    .app { max-width: none; flex-direction: row; flex-wrap: wrap; }
    .screen { flex: 1 1 45%; height: calc(100% - 90px); }
    .pad { flex: 0 0 auto; width: 46%; grid-template-rows: repeat(4, 1fr); height: calc(100% - 90px); }
    .key { aspect-ratio: auto; }
    .speak { flex: 1 1 100%; min-height: 64px; }
  }
</style>
</head>
<body>
<main class="app">
  <section class="screen" aria-live="polite">
    <div class="toast" id="toast"></div>
    <div class="digits-box" id="box"><div class="digits" id="digits"></div></div>
    <div class="words" id="words"></div>
  </section>

  <section class="pad" id="pad">
    <button class="key" data-k="7">7</button>
    <button class="key" data-k="8">8</button>
    <button class="key" data-k="9">9</button>
    <button class="key" data-k="4">4</button>
    <button class="key" data-k="5">5</button>
    <button class="key" data-k="6">6</button>
    <button class="key" data-k="1">1</button>
    <button class="key" data-k="2">2</button>
    <button class="key" data-k="3">3</button>
    <button class="key clear" data-k="C" aria-label="Clear">C</button>
    <button class="key" data-k="0">0</button>
    <button class="key back" data-k="B" aria-label="Delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
    </button>
  </section>

  <button class="speak" id="speak">
    <svg id="speakIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.5 3.4 6l-1.1 3.6c-.2.6.5 1.1 1 .8l4.3-2.6c.8.1 1.6.2 2.4.2 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></svg>
    <span id="speakLabel">Say it!</span>
  </button>
</main>

<script>
/* ================= Number → words (short scale, American) ================= */
const ONES = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

function underThousand(n) {           // 1..999
  const parts = [];
  const h = Math.floor(n / 100), r = n % 100;
  if (h) parts.push(ONES[h] + " hundred");
  if (r) {
    if (r < 20) parts.push(ONES[r]);
    else parts.push(TENS[Math.floor(r / 10)] + (r % 10 ? "-" + ONES[r % 10] : ""));
  }
  return parts.join(" ");
}

/* Conway–Wechsler names for 10^(3n+3), n = 1..999 */
const SMALL = ["", "million","billion","trillion","quadrillion","quintillion","sextillion",
  "septillion","octillion","nonillion"];
const U = ["", "un","duo","tre","quattuor","quinqua","se","septe","octo","nove"];
const T = [["",""],["deci","N"],["viginti","MS"],["triginta","NS"],["quadraginta","NS"],
  ["quinquaginta","NS"],["sexaginta","N"],["septuaginta","N"],["octoginta","MX"],["nonaginta",""]];
const H = [["",""],["centi","NX"],["ducenti","N"],["trecenti","NS"],["quadringenti","NS"],
  ["quingenti","NS"],["sescenti","N"],["septingenti","N"],["octingenti","MX"],["nongenti",""]];
const FAMILIAR = { 16: "sexdecillion", 19: "novemdecillion" };   // common spellings

function illion(n) {
  if (n < 10) return SMALL[n];
  if (FAMILIAR[n]) return FAMILIAR[n];
  const u = n % 10, t = Math.floor(n / 10) % 10, h = Math.floor(n / 100);
  const marks = t ? T[t][1] : H[h][1];
  let unit = U[u];
  if (unit === "tre" && /[SX]/.test(marks)) unit = "tres";
  else if (unit === "se") unit = marks.includes("X") ? "sex" : marks.includes("S") ? "ses" : "se";
  else if (unit === "septe" || unit === "nove") {
    if (marks.includes("M")) unit += "m"; else if (marks.includes("N")) unit += "n";
  }
  const stem = unit + T[t][0] + H[h][0];
  return stem.replace(/[aeiou]$/, "") + "illion";
}
function scaleName(i) {               // i = index of 3-digit group from the right
  if (i === 0) return "";
  if (i === 1) return "thousand";
  return illion(i - 1);
}

const MAX_DIGITS = 3003;              // up to 999 novenonagintanongentillion…

/* digit string → [{digits, words}] groups, left to right */
function toGroups(s) {
  const groups = [];
  const first = s.length % 3 || 3;
  groups.push(s.slice(0, first));
  for (let i = first; i < s.length; i += 3) groups.push(s.slice(i, i + 3));
  const n = groups.length;
  return groups.map((g, idx) => {
    const v = parseInt(g, 10);
    const scale = scaleName(n - 1 - idx);
    const words = v === 0 ? "" : underThousand(v) + (scale ? " " + scale : "");
    return { digits: g, words };
  });
}

/* ================= State & rendering ================= */
let value = "0";
const $digits = document.getElementById("digits");
const $box = document.getElementById("box");
const $words = document.getElementById("words");
const $speak = document.getElementById("speak");
const $label = document.getElementById("speakLabel");
const $toast = document.getElementById("toast");

function render() {
  const groups = toGroups(value);
  $digits.innerHTML = groups.map((g, i) =>
    `<span class="grp" data-i="${i}">${g.digits}${i < groups.length - 1 ? '<span class="comma">,</span>' : ""}</span>`
  ).join("");
  if (value === "0") $words.innerHTML = "zero";
  else $words.innerHTML = groups.map((g, i) => g.words ? `<span data-i="${i}">${g.words}</span>` : "")
    .filter(Boolean).join(" ");
  fit();
}

/* biggest font size such that the digits fit inside the box (wrapping at group boundaries) */
function fit() {
  const W = $box.clientWidth, Hh = $box.clientHeight;
  if (!W || !Hh) return;
  let lo = 8, hi = Math.min(Hh * 0.9, 160);
  for (let k = 0; k < 14; k++) {
    const mid = (lo + hi) / 2;
    $digits.style.fontSize = mid + "px";
    const fits = $digits.scrollHeight <= Hh + 1 && $digits.scrollWidth <= W + 1;
    if (fits) lo = mid; else hi = mid;
  }
  $digits.style.fontSize = lo + "px";
  $digits.style.overflowY = ($digits.scrollHeight > Hh + 1) ? "auto" : "hidden";
  $digits.style.alignContent = ($digits.scrollHeight > Hh + 1) ? "flex-start" : "center";
}
new ResizeObserver(fit).observe($box);

let toastTimer;
function toast(msg) {
  $toast.textContent = msg; $toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove("show"), 1400);
}

function press(k) {
  if (speaking) return;              // keys are locked while talking
  if (k === "C") value = "0";
  else if (k === "B") value = value.length > 1 ? value.slice(0, -1) : "0";
  else {
    if (value.length >= MAX_DIGITS) { toast("That's the biggest one!"); return; }
    value = value === "0" ? k : value + k;
  }
  if (navigator.vibrate) navigator.vibrate(8);
  render();
}

document.getElementById("pad").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if (b) press(b.dataset.k);
});
document.addEventListener("keydown", e => {
  if (speaking && e.key !== "Enter" && e.key !== " ") return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("B");
  else if (e.key === "Escape") press("C");
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSpeak(); }
  else return;
  const btn = document.querySelector(`[data-k="${/^[0-9]$/.test(e.key) ? e.key : e.key === "Backspace" ? "B" : "C"}"]`);
  if (btn && e.key !== "Enter" && e.key !== " ") { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 90); }
});

/* ================= Speech ================= */
const synth = window.speechSynthesis;
let voice = null, speaking = false, runId = 0;

function pickVoice() {
  if (!synth) return;
  const vs = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  const prefs = [/samantha/i, /google us english/i, /en-US/i, /en-GB/i];
  for (const p of prefs) {
    const v = vs.find(v => p.test(v.name) || p.test(v.lang));
    if (v) { voice = v; return; }
  }
  voice = vs[0] || null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

function highlight(i) {
  document.querySelectorAll(".on").forEach(el => el.classList.remove("on"));
  if (i == null) return;
  document.querySelectorAll(`[data-i="${i}"]`).forEach(el => {
    el.classList.add("on");
    el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
}

function setSpeakingUI(on) {
  speaking = on;
  $speak.classList.toggle("stop", on);
  $label.textContent = on ? "Stop" : "Say it!";
  document.querySelectorAll("#pad button").forEach(b => b.disabled = on);
}

function stop() {
  runId++;
  if (synth) synth.cancel();
  setSpeakingUI(false);
  highlight(null);
}

function toggleSpeak() {
  if (speaking) { stop(); return; }
  if (!synth) { toast("No voice on this device"); return; }
  synth.cancel();
  const groups = toGroups(value);
  const chunks = value === "0" ? [{ i: 0, text: "zero" }]
    : groups.map((g, i) => ({ i, text: g.words })).filter(c => c.text);
  const id = ++runId;
  setSpeakingUI(true);
  // speak one group at a time: lets us highlight it and avoids the
  // long-utterance cutoff some browsers have
  let n = 0;
  const next = () => {
    if (id !== runId) return;
    if (n >= chunks.length) { setSpeakingUI(false); highlight(null); return; }
    const c = chunks[n++];
    const u = new SpeechSynthesisUtterance(c.text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "en-US";
    u.rate = 0.85; u.pitch = 1.05;
    u.onstart = () => { if (id === runId) highlight(c.i); };
    u.onend = next;
    u.onerror = () => { if (id === runId) stop(); };
    synth.speak(u);
  };
  next();
}
$speak.addEventListener("click", toggleSpeak);

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
